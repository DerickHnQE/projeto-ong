<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONG - Cadastro de Voluntários</title>
    <!-- Link para o novo arquivo CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="main-header">
        <div class="container">
            <a href="index.html" class="logo">Logo ONG</a>
            
            <!-- Botão do Menu Hambúrguer -->
            <button class="hamburger-menu" aria-label="Abrir menu">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <!-- Navegação Sofisticada -->
            <nav class="main-nav">
                <ul class="nav-links">
                    <li><a href="index.html">Início</a></li>
                    <li class="dropdown">
                        <a href="projetos.html">Projetos</a>
                        <ul class="dropdown-menu">
                            <li><a href="projetos.html#voluntariado">Voluntariado</a></li>
                            <li><a href="projetos.html#doacoes">Doações</a></li>
                        </ul>
                    </li>
                    <li><a href="cadastro.html" class="active">Cadastro</a></li>
                    <li><a href="index.html#contato" class="btn btn-primary">Contato</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="section-padding">
            <div class="container">
                <div class="row">
                    <!-- Coluna centralizada para o formulário -->
                    <div class="col-12 col-md-10 col-lg-8 col-offset-md-1 col-offset-lg-2">
                        <h2 class="text-center">Cadastro de Voluntários</h2>
                        <p class="text-center lead">Preencha o formulário abaixo para se juntar à nossa equipe.</p>
                        
                        <!-- Formulário Estilizado -->
                        <form id="cadastroForm" class="styled-form">
                            <fieldset>
                                <legend>Dados Pessoais</legend>
                                <!-- 
                                  Formulários estilizados com validação visual:
                                  Classes .form-group e .form-control
                                  CSS aplica estilos a :invalid e :valid
                                -->
                                <div class="form-group">
                                    <label for="nomeCompleto">Nome Completo</label>
                                    <input type="text" id="nomeCompleto" class="form-control" name="nomeCompleto" required>
                                </div>
                                <div class="form-group">
                                    <label for="email">E-mail</label>
                                    <input type="email" id="email" class="form-control" name="email" required>
                                </div>
                                <div class="row">
                                    <div class="col-12 col-md-6">
                                        <div class="form-group">
                                            <label for="cpf">CPF</label>
                                            <input type="text" id="cpf" class="form-control" name="cpf" placeholder="000.000.000-00" required pattern="\d{3}\.\d{3}\.\d{3}-\d{2}">
                                        </div>
                                    </div>
                                    <div class="col-12 col-md-6">
                                        <div class="form-group">
                                            <label for="telefone">Telefone</label>
                                            <input type="tel" id="telefone" class="form-control" name="telefone" placeholder="(00) 00000-0000" required pattern="\(\d{2}\) \d{5}-\d{4}">
                                        </div>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label for="dataNascimento">Data de Nascimento</label>
                                    <input type="date" id="dataNascimento" class="form-control" name="dataNascimento" required>
                                </div>
                            </fieldset>

                            <fieldset>
                                <legend>Endereço</legend>
                                <div class="row">
                                    <div class="col-12 col-md-8">
                                        <div class="form-group">
                                            <label for="endereco">Endereço (Rua, Nº)</label>
                                            <input type="text" id="endereco" class="form-control" name="endereco" required>
                                        </div>
                                    </div>
                                    <div class="col-12 col-md-4">
                                        <div class="form-group">
                                            <label for="cep">CEP</label>
                                            <input type="text" id="cep" class="form-control" name="cep" placeholder="00000-000" required pattern="\d{5}-\d{3}">
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-12 col-md-6">
                                        <div class="form-group">
                                            <label for="cidade">Cidade</label>
                                            <input type="text" id="cidade" class="form-control" name="cidade" required>
                                        </div>
                                    </div>
                                    <div class="col-12 col-md-6">
                                        <div class="form-group">
                                            <label for="estado">Estado</label>
                                            <input type="text" id="estado" class="form-control" name="estado" required>
                                        </div>
                                    </div>
                                </div>
                            </fieldset>
                            
                            <!-- Botões com estados (hover, active, etc) -->
                            <div class="form-actions">
                                <button type="submit" class="btn btn-primary btn-lg">Enviar Cadastro</button>
                                <button type="reset" class="btn btn-outline">Limpar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="main-footer">
        <div class="container">
            <p>&copy; 2025 ONG - Ajuda Comunitária. Todos os direitos reservados.</p>
        </div>
    </footer>

    <!-- Script de Máscaras e Menu (Atualizado) -->
    <script src="js/main.js"></script>
</body>
</html>
