<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rede Solidária - Cadastro</title>
    <!-- Estilização interna (similar + estilos de formulário) -->
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background-color: #f4f4f4; color: #333; }
        header { background-color: #007bff; color: white; padding: 20px; text-align: center; }
        nav { background-color: #333; padding: 10px; text-align: center; }
        nav a { color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; }
        nav a:hover, nav a.active { background-color: #007bff; }
        main { max-width: 900px; margin: 20px auto; padding: 20px; background-color: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1, h2 { color: #007bff; }
        img { max-width: 100%; height: auto; border-radius: 8px; margin-top: 10px; }
        footer { text-align: center; padding: 20px; background-color: #333; color: white; margin-top: 20px; }
        
        /* Estilos do Formulário */
        form { display: flex; flex-direction: column; gap: 15px; }
        fieldset { border: 1px solid #ccc; border-radius: 8px; padding: 20px; }
        legend { color: #007bff; font-weight: bold; font-size: 1.1em; padding: 0 10px; }
        .form-group { display: flex; flex-direction: column; }
        label { margin-bottom: 5px; font-weight: bold; }
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1em;
        }
        /* Validação Nativa do HTML5 */
        input:invalid {
            border-color: #e53e3e;
        }
        input:valid {
            border-color: #38a169;
        }
        button[type="submit"] {
            background-color: #007bff;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            font-size: 1.1em;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button[type="submit"]:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <header>
        <h1>Rede Solidária</h1>
        <p>Conectando corações, transformando vidas.</p>
    </header>

    <nav>
        <a href="index.html">Início</a>
        <a href="projetos.html">Projetos</a>
        <a href="cadastro.html" class="active">Cadastro</a>
    </nav>

    <main>
        <section class="registration-form">
            <h2>Cadastro de Voluntários</h2>
            <p>Que bom ter você por aqui! Por favor, preencha o formulário abaixo para iniciar seu cadastro como voluntário.</p>
            
            <img src="imagens/junte-se.jpg" alt="[Imagem de um convite para se juntar à causa]">
            <!-- Lembre-se de adicionar uma imagem na sua pasta 'imagens' com o nome 'junte-se.jpg' -->

            <form action="#" method="POST" id="cadastroForm">
                
                <fieldset>
                    <legend>Dados Pessoais</legend>
                    
                    <div class="form-group">
                        <label for="nome">Nome Completo:</label>
                        <input type="text" id="nome" name="nome" required>
                    </div>

                    <div class="form-group">
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" name="email" placeholder="exemplo@email.com" required>
                    </div>

                    <div class="form-group">
                        <label for="cpf">CPF:</label>
                        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" 
                               pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" title="Digite um CPF no formato 000.000.000-00" required>
                    </div>

                    <div class="form-group">
                        <label for="telefone">Telefone:</label>
                        <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000"
                               pattern="\(\d{2}\) \d{5}-\d{4}" title="Digite um telefone no formato (00) 00000-0000" required>
                    </div>

                    <div class="form-group">
                        <label for="data_nascimento">Data de Nascimento:</label>
                        <input type="date" id="data_nascimento" name="data_nascimento" required>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Endereço</legend>

                    <div class="form-group">
                        <label for="cep">CEP:</label>
                        <input type="text" id="cep" name="cep" placeholder="00000-000"
                               pattern="\d{5}-\d{3}" title="Digite um CEP no formato 00000-000" required>
                    </div>

                    <div class="form-group">
                        <label for="endereco">Endereço (Rua, N°):</label>
                        <input type="text" id="endereco" name="endereco" required>
                    </div>

                    <div class="form-group">
                        <label for="cidade">Cidade:</label>
                        <input type="text" id="cidade" name="cidade" required>
                    </div>

                    <div class="form-group">
                        <label for="estado">Estado:</label>
                        <input type="text" id="estado" name="estado" required>
                    </div>
                </fieldset>

                <button type="submit">Enviar Cadastro</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Rede Solidária. Todos os direitos reservados.</p>
    </footer>

    <!-- Script para máscaras - deve estar na pasta 'js/main.js' -->
    <script src="js/main.js" defer></script>
</body>
</html>
